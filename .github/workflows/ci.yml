name: CI

# トリガー設定
on:
  push:

# 実行環境とジョブの設定
jobs:
  # メインビルドジョブ（Ubuntu）
  build:
    runs-on: ubuntu-latest
    
    steps:
      # ソースコードをチェックアウト
      - uses: actions/checkout@v6

      # Java 24のセットアップ
      - name: Java 24のセットアップ
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven
      
      # ビルド、テスト、パッケージの検証
      - name: ビルドとテスト
        run: ./mvnw -B clean verify
  
  # クロスプラットフォームテスト
  cross-platform-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            maven-command: .\mvnw.cmd
          - os: macos-latest
            maven-command: ./mvnw

    steps:
      # ソースコードをチェックアウト
      - uses: actions/checkout@v6

      # Java 24のセットアップ
      - name: Java 24のセットアップ
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      # ビルドとテスト
      - name: ビルドとテスト（${{ matrix.os }}）
        run: ${{ matrix.maven-command }} -B clean verify
