name: CI

# トリガー設定
on:
  push:

# 実行環境とジョブの設定
jobs:
  # メインビルドジョブ（Ubuntu）
  build:
    runs-on: ubuntu-latest
    
    steps:
      # ソースコードをチェックアウト
      - uses: actions/checkout@v6

      # Java 24のセットアップ
      - name: Java 24のセットアップ
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'

      # Mavenの依存関係をキャッシュ
      - name: Mavenキャッシュの設定
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      
      # プロジェクトのコンパイル
      - name: プロジェクトのコンパイル
        run: ./mvnw clean compile

      # テストの実行
      - name: テストの実行
        run: ./mvnw test

      # JARファイルの作成
      - name: JARファイルの作成
        run: ./mvnw package
  
  # クロスプラットフォームテスト
  cross-platform-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            maven-command: .\mvnw.cmd
          - os: macos-latest
            maven-command: ./mvnw

    steps:
      # ソースコードをチェックアウト
      - uses: actions/checkout@v6

      # Java 24のセットアップ
      - name: Java 24のセットアップ
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'

      # 基本的なビルドテスト
      - name: 基本ビルドテスト（${{ matrix.os }}）
        run: ${{ matrix.maven-command }} clean compile
