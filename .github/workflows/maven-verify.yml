name: Maven verify

on:
  workflow_call:
    inputs:
      runner:
        description: GitHub Actions runner label
        required: true
        type: string
      maven-command:
        description: Maven Wrapper command for the runner
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Java 24のセットアップ
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: ビルドとテスト
        run: ${{ inputs.maven-command }} -B clean verify
